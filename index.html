<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Pig Game</title>
  </head>
  <body>
    <main>
      <button class="btn--rules">Rules</button>
      <div class="modal-overlay">
        <div class="modal">
          <h2>🎲 Game Rules</h2>
          <p>
            1️⃣ Each player takes turns to roll the dice.<br />
            2️⃣ Roll as many times as you like to build score.<br />
            3️⃣ If you roll a 1, you lose your current turn's score!<br />
            4️⃣ Hold to add current score to your total.<br />
            5️⃣ First to reach 100 wins! 🏆
          </p>
          <button class="btn--close-modal">Close</button>
        </div>
      </div>
      <div class="player-container">
        <section class="player player--0 player--active">
          <h2 class="name" id="name--0">Player 1</h2>
          <p class="score" id="score--0">43</p>
          <div class="current">
            <p class="current-label">Current</p>
            <p class="current-score" id="current--0">0</p>
          </div>
        </section>
        <section class="player player--1">
          <h2 class="name" id="name--1">Player 2</h2>
          <p class="score" id="score--1">24</p>
          <div class="current">
            <p class="current-label">Current</p>
            <p class="current-score" id="current--1">0</p>
          </div>
        </section>
      </div>
      <img src="dice-5.png" alt="Playing dice" class="dice" />
      <div class="btn-container">
        <button class="btn btn--new">🔄 New game</button>
        <button class="btn btn--roll">🎲 Roll dice</button>
        <button class="btn btn--hold">📥 Hold</button>
      </div>
    </main>
  </body>
</html>
